<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на День Рождения!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <div class="card-front">
            <div class="front-content">
                <h1>Приглашение на День Рождения!</h1>
                <div class="balloon-container">
                    <div class="balloon"></div>
                    <div class="balloon"></div>
                    <div class="balloon"></div>
                </div>
                <p class="click-me">Нажми, чтобы открыть!</p>
            </div>
        </div>
        <div class="card-inside">
            <div class="inside-content">
                <h2>Ура! Мне исполняется 3 года!</h2>
                <div class="party-details">
                    <p>Дорогой друг!</p>
                    <p>Приглашаю тебя на мой День Рождения!</p>
                    <div class="details-box">
                        <p>🎈 Когда: [Дата и время]</p>
                        <p>📍 Где: [Адрес]</p>
                        <p>🎉 Будет много веселья, игр и вкусностей!</p>
                    </div>
                    <p class="rsvp">Пожалуйста, подтвердите своё присутствие по телефону: [номер телефона]</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
